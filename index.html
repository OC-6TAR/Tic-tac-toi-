
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
            color: #555;
        }

        .game {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .cell {
            height: 90px;
            background: #eee;
            border: none;
            border-radius: 12px;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            color: #667eea;
        }

        .cell:hover {
            background: #ddd;
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .reset {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .reset:hover {
            background: #764ba2;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Tic Tac Toe</h1>

        <p id="status">Player X's Turn</p>

        <div class="game">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>

        <button class="reset" onclick="resetGame()">
            Restart Game
        </button>

    </div>

    <script>

        const cells = document.querySelectorAll(".cell");
        const statusText = document.getElementById("status");

        let currentPlayer = "X";
        let gameActive = true;

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        cells.forEach((cell) => {
            cell.addEventListener("click", function() {

                if (cell.textContent !== "" || !gameActive) {
                    return;
                }

                cell.textContent = currentPlayer;

                checkWinner();

                if (gameActive) {
                    currentPlayer = currentPlayer === "X" ? "O" : "X";
                    statusText.textContent =
                        "Player " + currentPlayer + "'s Turn";
                }
            });
        });

        function checkWinner() {

            let winner = false;

            for (let condition of winningConditions) {

                const [a, b, c] = condition;

                if (
                    cells[a].textContent !== "" &&
                    cells[a].textContent === cells[b].textContent &&
                    cells[a].textContent === cells[c].textContent
                ) {
                    winner = true;
                    break;
                }
            }

            if (winner) {
                statusText.textContent =
                    "Player " + currentPlayer + " Wins! 🎉";

                gameActive = false;
                return;
            }

            let draw = [...cells].every(
                cell => cell.textContent !== ""
            );

            if (draw) {
                statusText.textContent = "It's a Draw! 🤝";
                gameActive = false;
            }
        }

        function resetGame() {

            cells.forEach(cell => {
                cell.textContent = "";
            });

            currentPlayer = "X";
            gameActive = true;

            statusText.textContent = "Player X's Turn";
        }

    </script>

</body>
</html>
